<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AppDeck — библиотека установленных программ Windows: поиск, категории и быстрый запуск."
    />
    <meta name="theme-color" content="#080b14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AppDeck — установленные программы</title>
    <script>
      try {
        var savedTheme = localStorage.getItem("appdeck.theme");
        if (["dark", "light", "amoled", "warm", "nord"].indexOf(savedTheme) !== -1) {
          document.documentElement.dataset.theme = savedTheme;
          document.documentElement.style.colorScheme = savedTheme === "light" ? "light" : "dark";
        }
        var savedAccent = localStorage.getItem("appdeck.accent");
        if (savedAccent && /^#[0-9a-f]{6}$/i.test(savedAccent)) {
          var r = parseInt(savedAccent.slice(1, 3), 16);
          var g = parseInt(savedAccent.slice(3, 5), 16);
          var b = parseInt(savedAccent.slice(5, 7), 16);
          var lum = function (c) { var s = c / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); };
          var bgL = 0.2126 * lum(r) + 0.7152 * lum(g) + 0.0722 * lum(b);
          var wC = 1.05 / (bgL + 0.05);
          var dC = (bgL + 0.05) / (0.2126 * lum(18) + 0.7152 * lum(18) + 0.0722 * lum(18) + 0.05);
          var st = document.documentElement.style;
          st.setProperty("--accent", savedAccent);
          st.setProperty("--accent-strong", savedAccent);
          st.setProperty("--accent-text", savedAccent);
          st.setProperty("--accent-soft", "rgba(" + r + "," + g + "," + b + ",0.12)");
          st.setProperty("--accent-border", "rgba(" + r + "," + g + "," + b + ",0.34)");
          st.setProperty("--accent-contrast", wC >= dC ? "#FFFFFF" : "#121212");
          st.setProperty("--accent-glow", "rgba(" + r + "," + g + "," + b + ",0.2)");
          st.setProperty("--user-accent", savedAccent);
          document.documentElement.dataset.customAccent = "true";
        }
        var savedBg = localStorage.getItem("appdeck.bg");
        if (savedBg) {
          var parsedBg = JSON.parse(savedBg);
          if (parsedBg && typeof parsedBg.dim === "number") {
            var img = parsedBg.type === "gradient"
              ? "linear-gradient(" + parsedBg.angle + "deg, " + parsedBg.from + ", " + parsedBg.to + ")"
              : (parsedBg.type === "image" && typeof parsedBg.dataUrl === "string" && parsedBg.dataUrl.indexOf("data:image/") === 0
                ? 'url("' + parsedBg.dataUrl + '")' : null);
            if (img) {
              document.documentElement.dataset.customBg = parsedBg.type;
              document.documentElement.style.setProperty("--custom-bg-image", img);
              document.documentElement.style.setProperty("--custom-bg-dim", parsedBg.dim + "%");
            }
          }
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
